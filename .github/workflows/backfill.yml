name: Geçmiş Veri Yükleme

# İstekler backfill-request.json dosyasındadır; dosya değişip gönderildiğinde çalışır.
on:
  push:
    branches: [claude/yeni-firsat-radari-z71fl2]
    paths: ["backfill-request.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

env:
  RADAR_USER_AGENT: ${{ secrets.RADAR_USER_AGENT }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      count: ${{ steps.plan.outputs.count }}
      datasets: ${{ steps.plan.outputs.datasets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - id: plan
        run: |
          out=$(python -m radar.backfill.runner plan)
          echo "$out" | jq .
          echo "matrix=$(echo "$out" | jq -c '.matrix')" >> "$GITHUB_OUTPUT"
          echo "max_parallel=$(echo "$out" | jq '.max_parallel')" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$out" | jq '.count')" >> "$GITHUB_OUTPUT"
          echo "datasets=$(echo "$out" | jq -r '.datasets')" >> "$GITHUB_OUTPUT"
      - name: Arşiv sürümünü hazırla
        run: |
          gh release view veri-arsivi >/dev/null 2>&1 || gh release create veri-arsivi --prerelease \
            --target "$GITHUB_SHA" --title "Veri arşivi" \
            --notes "Fırsat Radarı geçmiş veri bölümleri (Parquet). İçerik ve doğrulamalar: data/manifest/*.json"

  load:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Bölümü yükle ve doğrula
        run: python -m radar.backfill.runner run --dataset "${{ matrix.dataset }}" --partition "${{ matrix.partition }}"
      - name: Arşive yükle
        run: |
          f="data/backfill/${{ matrix.dataset }}/${{ matrix.dataset }}__${{ matrix.partition }}.parquet"
          if [ -f "$f" ]; then gh release upload veri-arsivi "$f" --clobber; else echo "Bölüm kırmızı; yüklenmedi"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.dataset }}-${{ matrix.partition }}
          path: data/manifest/parts/
          retention-days: 3

  finalize:
    needs: [plan, load]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: data/manifest/parts/
      - name: Veri seti kontrolleri, manifest ve türetilmiş tablolar
        run: |
          for ds in ${{ needs.plan.outputs.datasets }}; do
            echo "::group::$ds"
            mkdir -p "data/backfill/$ds"
            gh release download veri-arsivi -p "${ds}__*" -D "data/backfill/$ds" --clobber || echo "henüz bölüm yok"
            python -m radar.backfill.runner finalize --dataset "$ds"
            for a in $(jq -r '.derived // {} | .[].asset' "data/manifest/$ds.json"); do
              gh release upload veri-arsivi "data/backfill/$ds/$a" --clobber
            done
            rm -rf "data/backfill/$ds"
            echo "::endgroup::"
          done
      - name: Manifest ve raporları branch'e yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest reports/backfill
          git diff --cached --quiet && exit 0
          git commit -m "Geçmiş veri: ${{ needs.plan.outputs.datasets }} manifest ve rapor"
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 10
          done
