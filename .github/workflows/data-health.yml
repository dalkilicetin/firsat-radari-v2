name: Veri Sağlık Kontrolü

on:
  push:
    branches: [claude/yeni-firsat-radari-z71fl2]
    paths: ["radar/**", "tests/**", "requirements.txt", ".github/workflows/data-health.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 6"  # Cumartesi 04:17 UTC (zamanlama yalnızca varsayılan branch'te çalışır)

permissions:
  contents: write

concurrency:
  group: data-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Birim testleri
        run: python -m pytest -q
      - name: Canlı veri sağlık kontrolü
        run: python -m radar.health
        env:
          RADAR_USER_AGENT: ${{ secrets.RADAR_USER_AGENT }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Raporu branch'e yaz
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/data_health data/state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Veri sağlık raporu $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
